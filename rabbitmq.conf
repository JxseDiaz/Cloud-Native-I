# Cargar definiciones (policies) al arrancar
load_definitions = /etc/rabbitmq/definitions.json

# Configuración de clustering automático
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Reintentos para que los nodos se descubran
cluster_formation.discovery_retry_limit = 30
cluster_formation.discovery_retry_interval = 2000
cluster_formation.node_cleanup.interval = 10000

# Distribución del líder de las colas entre los nodos
queue_leader_locator = balanced
